<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111113" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g stroke="#27272a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Radial highlight flare -->
  <circle cx="600" cy="180" r="350" fill="#3b82f6" opacity="0.08" />

  <!-- Header Badge & Logo -->
  <g transform="translate(100, 90)">
    <!-- Logo Icon -->
    <rect width="56" height="56" rx="14" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <path d="M16 20h24M28 20v22M21 42h14" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="16" r="4" fill="#f59e0b"/>

    <!-- App Title -->
    <text x="76" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="34" letter-spacing="-0.5">tipTap</text>
    <rect x="200" y="16" width="96" height="26" rx="13" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="248" y="33" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle" letter-spacing="1">PRO SPEED</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 220)">
    <text x="0" y="0" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="800" font-size="54" letter-spacing="-1.5">
      The Premium Touch Typing
    </text>
    <text x="0" y="65" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-weight="800" font-size="54" letter-spacing="-1.5">
      Experience for Mastery &amp; Speed.
    </text>
    <text x="0" y="125" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="22" letter-spacing="-0.2">
      Apple-inspired minimalism · 16 Academy Lessons · Mechanical Switch Acoustics · Local-First
    </text>
  </g>

  <!-- Metric Badges Floating Row -->
  <g transform="translate(100, 420)">
    <!-- Card 1: WPM -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="220" height="120" rx="16" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1.5" />
      <text x="24" y="36" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="0.5">PEAK SPEED</text>
      <text x="24" y="82" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="42">128</text>
      <text x="110" y="80" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="16">WPM</text>
    </g>

    <!-- Card 2: Accuracy -->
    <g filter="url(#shadow)" transform="translate(245, 0)">
      <rect x="0" y="0" width="220" height="120" rx="16" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1.5" />
      <text x="24" y="36" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="0.5">ACCURACY</text>
      <text x="24" y="82" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="42">99.4</text>
      <text x="135" y="80" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="18">%</text>
    </g>

    <!-- Card 3: Academy Course -->
    <g filter="url(#shadow)" transform="translate(490, 0)">
      <rect x="0" y="0" width="235" height="120" rx="16" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1.5" />
      <text x="24" y="36" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="0.5">ACADEMY</text>
      <text x="24" y="82" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="42">16</text>
      <text x="82" y="80" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="16">LESSONS</text>
    </g>

    <!-- Card 4: Sound Engine -->
    <g filter="url(#shadow)" transform="translate(750, 0)">
      <rect x="0" y="0" width="250" height="120" rx="16" fill="url(#cardGlow)" stroke="#27272a" stroke-width="1.5" />
      <text x="24" y="36" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="0.5">ACOUSTICS</text>
      <text x="24" y="80" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="28">Mechanical</text>
      <text x="24" y="102" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="13">Cream · Clicky · Typewriter</text>
    </g>
  </g>
</svg>
